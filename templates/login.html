{% extends "base.html" %}

{% block title %}Login - Trekking Management Application{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right"></i> Account Login</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Sign In</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <p class="mb-0 small text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary">Register here</a></p>
                <p class="mb-0 mt-2 small text-secondary">Default Admin: <strong>admin</strong> | Password: <strong>adminpassword</strong></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
