{% extends "base.html" %}

{% block title %}Add New Trek - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-plus-circle"></i> Create New Trek Route</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('add_trek') }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Trek Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Kedarkantha Trek">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-bold">Location *</label>
                            <input type="text" class="form-control" id="location" name="location" required placeholder="e.g. Uttarakhand, India">
                        </div>
                        <div class="col-md-6">
                            <label for="difficulty" class="form-label fw-bold">Difficulty Level *</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="Easy">Easy</option>
                                <option value="Moderate" selected>Moderate</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="duration_days" class="form-label fw-bold">Duration (Days) *</label>
                            <input type="number" class="form-control" id="duration_days" name="duration_days" min="1" value="3" required>
                        </div>
                        <div class="col-md-4">
                            <label for="total_slots" class="form-label fw-bold">Total Available Slots *</label>
                            <input type="number" class="form-control" id="total_slots" name="total_slots" min="1" value="15" required>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label fw-bold">Price (₹) *</label>
                            <input type="number" step="0.01" class="form-control" id="price" name="price" value="2500.00" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="start_date" class="form-label fw-bold">Start Date *</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="end_date" class="form-label fw-bold">End Date *</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="assigned_staff_id" class="form-label fw-bold">Assign Trek Staff (Optional)</label>
                        <select class="form-select" id="assigned_staff_id" name="assigned_staff_id">
                            <option value="">-- None (Unassigned) --</option>
                            {% for staff in staff_members %}
                                <option value="{{ staff.id }}">{{ staff.full_name }} ({{ staff.username }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-check-lg"></i> Create Trek</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
