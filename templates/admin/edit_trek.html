{% extends "base.html" %}

{% block title %}Edit Trek - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square"></i> Edit Trek: {{ trek.name }}</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Trek Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ trek.name }}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-bold">Location *</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ trek.location }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="difficulty" class="form-label fw-bold">Difficulty Level *</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="duration_days" class="form-label fw-bold">Duration (Days) *</label>
                            <input type="number" class="form-control" id="duration_days" name="duration_days" min="1" value="{{ trek.duration_days }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="total_slots" class="form-label fw-bold">Total Slots *</label>
                            <input type="number" class="form-control" id="total_slots" name="total_slots" min="1" value="{{ trek.total_slots }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label fw-bold">Price (₹) *</label>
                            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ trek.price }}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="start_date" class="form-label fw-bold">Start Date *</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ trek.start_date }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="end_date" class="form-label fw-bold">End Date *</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" value="{{ trek.end_date }}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-bold">Trek Status *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="assigned_staff_id" class="form-label fw-bold">Assigned Staff</label>
                            <select class="form-select" id="assigned_staff_id" name="assigned_staff_id">
                                <option value="">-- Unassigned --</option>
                                {% for staff in staff_members %}
                                    <option value="{{ staff.id }}" {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                                        {{ staff.full_name }} ({{ staff.username }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-save"></i> Save Changes</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
