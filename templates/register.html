{% extends "base.html" %}

{% block title %}Register - Trekking Management Application{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill"></i> Create New Account</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-bold">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-bold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Create a password">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-bold">Full Name *</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="Enter full name">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-bold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-bold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="Contact number">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Account Role *</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="role_user" value="User" checked>
                                <label class="form-check-label" for="role_user">
                                    <i class="bi bi-person me-1"></i> User (Trekker)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="role_staff" value="Staff">
                                <label class="form-check-label" for="role_staff">
                                    <i class="bi bi-person-badge me-1"></i> Trek Staff (Requires Admin Approval)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">Register Account</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <p class="mb-0 small text-muted">Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-success">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
